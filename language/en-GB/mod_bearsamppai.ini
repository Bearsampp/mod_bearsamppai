; Bearsampp AI Module - English (GB)
; Note: All translation files should be saved with UTF-8 encoding.

MOD_BEARSAMPPAI="Bearsampp AI"
MOD_BEARSAMPPAI_XML_DESCRIPTION="Joomla 5.4/6 ready floating AI chat widget. Answers visitor questions through an OpenAI-compatible AI API (OpenRouter by default), grounded in the articles, FAQ articles and Kunena forum topics you choose. Optional light/dark theme, four viewport positions, welcome message and connection indicator."

; Content sources fieldset
MOD_BEARSAMPPAI_FIELDSET_CONTENT_LABEL="Knowledge Base Content"
MOD_BEARSAMPPAI_FIELDSET_CONTENT_DESC="Choose the content the AI is allowed to answer from. Every published article in the selected categories is a candidate, as is every article in the FAQ category. The knowledge context limit decides how much is actually sent, so the newest articles fill it first."
MOD_BEARSAMPPAI_FIELD_ARTICLES_CATEGORIES_LABEL="Article categories"
MOD_BEARSAMPPAI_FIELD_ARTICLES_CATEGORIES_DESC="Categories whose published articles are sent to the AI as context. Several can be selected; an article is used when it belongs to any of them. Leave empty to use every published article site-wide."
MOD_BEARSAMPPAI_FIELD_FAQ_CATEGORY_LABEL="FAQ category"
MOD_BEARSAMPPAI_FIELD_FAQ_CATEGORY_DESC="The category holding your FAQ articles. Each article is read as a question in its title and the answer in its text. Leave empty to include no FAQ content."
MOD_BEARSAMPPAI_FIELD_SHOW_FORUM_LABEL="Include Kunena forum topics"
MOD_BEARSAMPPAI_FIELD_SHOW_FORUM_DESC="No by default, so installing Kunena never changes what the AI can see. Set this to Yes to include published Kunena topics as context, most recently active first; it has no effect when Kunena is not installed."

; AI chat fieldset
MOD_BEARSAMPPAI_FIELDSET_AI_LABEL="AI Chat"
MOD_BEARSAMPPAI_FIELD_SHOW_CHAT_LABEL="Show AI chat widget"
MOD_BEARSAMPPAI_FIELD_SHOW_CHAT_DESC="Enable the AI-powered chat that answers questions using the article, FAQ and forum content you select as grounding context."
MOD_BEARSAMPPAI_FIELD_AI_KEY_LABEL="AI API key"
MOD_BEARSAMPPAI_FIELD_AI_KEY_DESC="API key for the AI service. With the default endpoint this is an OpenRouter key. Any OpenAI-compatible service works if you also change the endpoint and model. The key is only read on the server and is never sent to the browser."
MOD_BEARSAMPPAI_FIELD_AI_MODEL_LABEL="AI model"
MOD_BEARSAMPPAI_FIELD_AI_MODEL_DESC="Model your AI service should answer with. The default is qwen/qwen3.8-27b:free on OpenRouter. Use any model id the service accepts."
MOD_BEARSAMPPAI_FIELD_AI_FALLBACK_MODEL_LABEL="Fallback model"
MOD_BEARSAMPPAI_FIELD_AI_FALLBACK_MODEL_DESC="Model tried once if the primary request times out, is rate limited (HTTP 429) or returns a server error (HTTP 5xx). The default is google/gemma-4-31b-it:free, a free OpenRouter model. Leave blank to disable fallback."
MOD_BEARSAMPPAI_FIELD_AI_ENDPOINT_LABEL="AI endpoint"
MOD_BEARSAMPPAI_FIELD_AI_ENDPOINT_DESC="OpenAI-compatible chat completions endpoint. Leave the default for OpenRouter, or point it at any other compatible service."
MOD_BEARSAMPPAI_FIELD_MAX_TOKENS_LABEL="Max response tokens"
MOD_BEARSAMPPAI_FIELD_TEMPERATURE_LABEL="Temperature"
MOD_BEARSAMPPAI_FIELD_TIMEOUT_LABEL="Request timeout (seconds)"
MOD_BEARSAMPPAI_FIELD_FALLBACK_TIMEOUT_LABEL="Fallback timeout (seconds)"
MOD_BEARSAMPPAI_FIELD_FALLBACK_TIMEOUT_DESC="Maximum time to wait for the fallback model after the primary request times out or returns HTTP 503. Default: 10 seconds."
MOD_BEARSAMPPAI_FIELD_CONTEXT_LIMIT_LABEL="Knowledge context limit (characters)"
MOD_BEARSAMPPAI_FIELD_CONTEXT_LIMIT_DESC="Maximum number of characters of article, FAQ and forum content sent to the AI as context."
MOD_BEARSAMPPAI_FIELD_CHAT_HEADING_LABEL="Chat button label"
MOD_BEARSAMPPAI_FIELD_CHAT_PLACEHOLDER_LABEL="Input placeholder"
MOD_BEARSAMPPAI_FIELD_CHAT_NODATA_LABEL="Fallback answer"
MOD_BEARSAMPPAI_FIELD_CHAT_NODATA_DESC="Answer returned when the knowledge base does not contain any relevant information."
MOD_BEARSAMPPAI_FIELD_CHAT_POSITION_LABEL="Widget position"
MOD_BEARSAMPPAI_FIELD_CHAT_POSITION_DESC="Where the chat button and panel are anchored on the viewport. Middle-left and middle-right sit at half the screen height, which is rarely what you want on a phone - the button stays where you put it, so use a bottom corner if the site is used on mobile."
MOD_BEARSAMPPAI_FIELD_CHAT_WIDTH_LABEL="Panel width (px)"
MOD_BEARSAMPPAI_FIELD_CHAT_HEIGHT_LABEL="Panel height (px)"
MOD_BEARSAMPPAI_FIELD_CHAT_OFFSET_X_LABEL="Horizontal offset (px)"
MOD_BEARSAMPPAI_FIELD_CHAT_OFFSET_Y_LABEL="Vertical offset (px)"
MOD_BEARSAMPPAI_FIELD_CHAT_OFFSET_DESC="Distance from the viewport edge. Uses the horizontal offset for left/right anchoring and the vertical offset for bottom/middle anchoring."
MOD_BEARSAMPPAI_FIELD_CHAT_MOBILE_LABEL_LABEL="Show button label on mobile"
MOD_BEARSAMPPAI_FIELD_CHAT_MOBILE_LABEL_DESC="On small screens the collapsed launcher becomes a small round icon button so it does not cover a large part of the screen. Set this to Yes to keep the text label on phones as well. The label stays available to screen readers either way."
MOD_BEARSAMPPAI_FIELD_CHAT_THEME_LABEL="Default theme"
MOD_BEARSAMPPAI_FIELD_CHAT_THEME_DESC="Auto follows the visitor's system preference. Light/Dark force a scheme. Visitors can still toggle at runtime (stored in their browser)."
MOD_BEARSAMPPAI_FIELD_CHAT_SHOW_COPY_LABEL="Show copy conversation button"
MOD_BEARSAMPPAI_FIELD_CHAT_SHOW_COPY_DESC="Adds a button in the panel header that copies the conversation with timestamps to the clipboard."
MOD_BEARSAMPPAI_FIELD_CHAT_GREETING_LABEL="Welcome message"
MOD_BEARSAMPPAI_FIELD_CHAT_GREETING_DESC="Shown as the first assistant message when the chat opens. Leave empty for no welcome message."
MOD_BEARSAMPPAI_FIELD_CHAT_SHOW_STATUS_LABEL="Show connection status"
MOD_BEARSAMPPAI_FIELD_CHAT_SHOW_STATUS_DESC="Shows a small indicator in the panel header that periodically checks the chat is reachable."
MOD_BEARSAMPPAI_FIELD_CHAT_STATUS_INTERVAL_LABEL="Status check interval (seconds)"
MOD_BEARSAMPPAI_POSITION_BOTTOM_RIGHT="Bottom right"
MOD_BEARSAMPPAI_POSITION_BOTTOM_LEFT="Bottom left"
MOD_BEARSAMPPAI_POSITION_MIDDLE_RIGHT="Middle right"
MOD_BEARSAMPPAI_POSITION_MIDDLE_LEFT="Middle left"
MOD_BEARSAMPPAI_THEME_AUTO="Auto (system preference)"
MOD_BEARSAMPPAI_THEME_LIGHT="Light"
MOD_BEARSAMPPAI_THEME_DARK="Dark"

