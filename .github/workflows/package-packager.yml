name: Package and Release Module

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Joomla Extension Packager
          uses: N6REJ/joomla-packager@316d835d092b8e84328e838efc522055727c8407 # main: packaged updates.xml is synced to the build version
        id: package
        with:
          extension-name: 'mod_bearsamppai'
          extension-xml: 'mod_bearsamppai.xml'
          extension-type: 'module'
          author: 'Bearsampp'
          copyright-holder: 'Bearsampp'
          copyright-start-year: '2026'
          license-file: 'LICENSE'
          update-joomla-server: 'true'
          commit-changes: 'true'
          github-token: ${{ secrets.GH_PAT }}
