name: Package and Release Module

on:
  workflow_dispatch:

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Joomla Extension Packager
        uses: N6REJ/joomla-packager@2026.10.17.2 # 2026.10.17.2 - fixes inline SHA-256 cleanup to preserve feed XML
        id: package
        with:
          extension-name: 'mod_bearsamppai'
          extension-xml: 'mod_bearsamppai.xml'
          extension-type: 'module'
          # Feed matching: Joomla silently ignores entries missing client or
          # targetplatform. Match Joomla 5 and 6 so J5.4 installs are offered
          # the update too; only applied when updates.xml does not already
          # declare them.
          extension-client: 'site'
          targetplatform-name: 'joomla'
          targetplatform-version: '(5|6).*'
          author: 'Bearsampp'
          copyright-holder: 'Bearsampp'
          copyright-start-year: '2026'
          license-file: 'LICENSE'
          # Only publish a release, update the update server and commit changes
          # on the main branch. Runs from any other branch are test builds: they
          # still bump the manifest version and produce an installable package,
          # but leave the changelog, updates.xml and releases untouched and only
          # expose the package as a workflow artifact.
          create-release: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && 'true' || 'false' }}
          update-joomla-server: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && 'true' || 'false' }}
          commit-changes: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && 'true' || 'false' }}
          generate-changelog: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && 'true' || 'false' }}
          upload-artifact: 'true'
          ignore-docs: 'true'
          ignore-stats: 'true'
          ignore-updates-xml: 'true'
          github-token: ${{ secrets.GH_PAT }}

      - name: Upload extension package files
        uses: actions/upload-artifact@v7 # v7.0.1 (Node 24)
        with:
          name: mod_bearsamppai_${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.package-path }}
          retention-days: 90
          if-no-files-found: warn
