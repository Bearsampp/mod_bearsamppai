name: Package and Release Module

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Joomla Extension Packager
        uses: N6REJ/joomla-packager@3ef7f233e49ce7b458c28b69b6a25e8312151c84 # 2026.10.2 - fills in the update feed fields Joomla needs to match
        id: package
        with:
          extension-name: 'mod_bearsamppai'
          extension-xml: 'mod_bearsamppai.xml'
          extension-type: 'module'
          # Match Joomla 5 and 6 so J5.4 installs are offered the update too;
          # only applied when updates.xml does not already declare a platform.
          targetplatform-version: '[56]\.[0-9]+'
          author: 'Bearsampp'
          copyright-holder: 'Bearsampp'
          copyright-start-year: '2026'
          license-file: 'LICENSE'
          update-joomla-server: 'true'
          commit-changes: 'true'
          upload-artifact: 'false'
          github-token: ${{ secrets.GH_PAT }}

      - name: Upload extension package files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: mod_bearsamppai_${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.package-path }}
          retention-days: 90
          if-no-files-found: warn
